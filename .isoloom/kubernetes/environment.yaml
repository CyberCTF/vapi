apiVersion: v1
kind: Namespace
metadata:
  name: isoloom-vapi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: db
  template:
    metadata:
      labels:
        isoloom.com/machine: db
        net.isoloom.com/lab: member
    spec:
      hostname: db
      initContainers:
      - name: isoloom-probe
        image: busybox:1.37.0-musl
        command:
        - /bin/cp
        - /bin/busybox
        - /probe/busybox
        volumeMounts:
        - name: isoloom-probe
          mountPath: /probe
      containers:
      - name: db
        image: isoloom/vapi-db
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3306
        readinessProbe:
          exec:
            command:
            - /.isoloom-probe/busybox
            - sh
            - -c
            - /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3306
          periodSeconds: 5
          failureThreshold: 60
        env:
        - name: CTF_FLAG_API1
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API1
              optional: true
        - name: CTF_FLAG_API2
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API2
              optional: true
        - name: CTF_FLAG_API3
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API3
              optional: true
        - name: CTF_FLAG_API4
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API4
              optional: true
        - name: CTF_FLAG_API5
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API5
              optional: true
        - name: CTF_FLAG_API8
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API8
              optional: true
        - name: CTF_FLAG_API9
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API9
              optional: true
        resources:
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
      - name: init
        image: isoloom/vapi-db
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - until /.isoloom-probe/busybox nc -z -w 2 127.0.0.1 3306; do sleep 2; done && sh /isoloom/scripts/ctf__db-flags.sh && exec sleep infinity
        env:
        - name: CTF_FLAG_API1
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API1
              optional: true
        - name: CTF_FLAG_API2
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API2
              optional: true
        - name: CTF_FLAG_API3
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API3
              optional: true
        - name: CTF_FLAG_API4
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API4
              optional: true
        - name: CTF_FLAG_API5
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API5
              optional: true
        - name: CTF_FLAG_API8
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API8
              optional: true
        - name: CTF_FLAG_API9
          valueFrom:
            secretKeyRef:
              name: isoloom-inputs
              key: CTF_FLAG_API9
              optional: true
        volumeMounts:
        - name: isoloom-probe
          mountPath: /.isoloom-probe
          readOnly: true
        - name: scripts
          mountPath: /isoloom/scripts
      nodeSelector:
        kubernetes.io/arch: amd64
      volumes:
      - name: scripts
        configMap:
          name: isoloom-scripts
          defaultMode: 493
      - name: isoloom-probe
        emptyDir: {}
