      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: www
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      isoloom.com/machine: www
  template:
    metadata:
      labels:
        isoloom.com/machine: www
        net.isoloom.com/lab: member
